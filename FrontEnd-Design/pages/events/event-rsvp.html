<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Event RSVP | PNP</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="event-rsvp.css">
    <link rel="stylesheet" href="events-back.css">
    <script src="../../shared-layout.js" defer></script>
    <script src="../../script.js" defer></script>
    <script src="event-data.js" defer></script>
    <script src="event-rsvp.js" defer></script>
</head>
<body>
    <div data-site-header></div>
    <main id="main-content">
        <section class="rsvp-banner" aria-labelledby="rsvp-title">
            <header class="rsvp-intro">
                <h1 id="rsvp-title">Be a Part<br>of the <span>Change</span></h1>
                <p>Register for the upcoming PNP public programme and join the dialogue for a better Karnataka.</p>
                <a class="events-back-button" href="events.html"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m14 6-6 6 6 6M8 12h12"/></svg>Back to Events</a>
            </header>
            <div class="rsvp-map" aria-hidden="true"><div></div></div>
            <div class="rsvp-flow">
                <ol class="rsvp-steps" aria-label="Registration progress">
                    <li aria-current="step"><span>1</span>Enter Mobile</li>
                    <li><span>2</span>Verify OTP</li>
                    <li><span>3</span>Confirm</li>
                </ol>
                <div class="rsvp-card">
                    <form id="rsvp-form">
                        <h2 id="rsvp-step-title" tabindex="-1">Step 1: Verify Your Mobile Number</h2>
                        <div class="rsvp-fields">
                            <label class="rsvp-input">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M7 3h3l2 5-3 2a13 13 0 0 0 5 5l2-3 5 2v3c0 2-1 4-3 4C10 21 3 14 3 6c0-2 2-3 4-3Z"/></svg>
                                <input id="rsvp-code" aria-label="Mobile number" aria-describedby="rsvp-hint" type="tel" inputmode="numeric" autocomplete="tel-national" placeholder="Enter 10-digit mobile number" pattern="[0-9]{10}" maxlength="10" required>
                            </label>
                            <button id="rsvp-submit" class="rsvp-button" type="submit" disabled>Get OTP <span aria-hidden="true">&rarr;</span></button>
                        </div>
                        <p class="rsvp-hint" id="rsvp-hint" role="status">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 4v3"/></svg>
                            <span>Preview only. Use a sample number to try the 6-digit OTP flow.</span>
                        </p>
                        <button id="rsvp-back" type="button" hidden>Change mobile number</button>
                    </form>
                    <p id="rsvp-event" hidden></p>
                </div>
            </div>
            <svg class="rsvp-waves" viewBox="0 0 1000 55" preserveAspectRatio="none" aria-hidden="true">
                <path fill="#ffdb00" d="M0 0C210 64 260-9 452 47S796 43 1000 17V55H0Z"/>
                <path fill="#ee0066" d="M0 18C151 54 280-22 431 33S751 70 1000 35V55H0Z"/>
                <path fill="#05275f" d="M179 55C334 20 370 39 468 55Z"/>
            </svg>
        </section>
    </main>
    <div data-site-footer></div>
</body>
</html>
