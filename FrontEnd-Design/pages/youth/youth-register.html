<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Youth Registration | Praja Nishchaya Party</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="youth.css">
    <link rel="stylesheet" href="youth-register.css">
    <script src="../../shared-layout.js" defer></script>
    <script src="../../script.js" defer></script>
    <script src="youth-register.js" defer></script>
</head>
<body>
    <div data-site-header></div>
    <main id="main-content">
        <section class="youth-zone youth-register" aria-labelledby="youth-register-title">
            <div class="youth-register-intro">
                <p class="youth-register-brand"><strong>PNP</strong><span>Praja Nishchaya Party</span></p>
                <h1 id="youth-register-title">Join the <em>Youth Movement</em></h1>
                <p class="youth-register-copy">Register to participate in PNP’s youth and campus initiatives.</p>
                <ul class="youth-register-benefits">
                    <li><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 10h5l11-6v16L8 14H3zm5 4 2 6h3l-2-5m10-6 2-1m-2 7 2 1"/></svg><span>Be Heard</span></li>
                    <li><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M16 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0ZM4 21v-2a8 8 0 0 1 16 0v2M3 5a3 3 0 0 0 0 6m18-6a3 3 0 0 1 0 6"/></svg><span>Get Involved</span></li>
                    <li><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m12 2 2 3 4 1 1 4 2 2-2 2-1 4-4 1-2 3-2-3-4-1-1-4-2-2 2-2 1-4 4-1zM15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/></svg><span>Build Skills</span></li>
                    <li><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 18C3 8 9 3 21 3c0 10-5 16-13 16M3 21 16 9"/></svg><span>Serve Communities</span></li>
                </ul>
                <p class="youth-register-credit">AI-generated illustration</p>
            </div>
            <form class="youth-register-card" aria-labelledby="youth-form-title" aria-describedby="youth-register-status">
                <h2 id="youth-form-title"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m3 21 5-1L21 7l-5-5L3 15zm11-17 5 5"/></svg> Register Now</h2>
                <div class="youth-register-body">
                    <div class="youth-register-fields">
                        <label class="youth-register-field"><span class="youth-register-sr">Full Name</span><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M16 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0ZM4 21v-2a8 8 0 0 1 16 0v2z"/></svg><input type="text" autocomplete="name" placeholder="Full Name *" required></label>
                        <label class="youth-register-field"><span class="youth-register-sr">Mobile Number</span><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 3 2 6c0 8 8 16 16 16l4-4-5-4-3 3a14 14 0 0 1-7-7l3-3-4-5z"/></svg><input type="tel" inputmode="numeric" autocomplete="tel-national" pattern="[0-9]{10}" maxlength="10" title="Enter a 10-digit mobile number" placeholder="Mobile Number *" required></label>
                        <label class="youth-register-field"><span class="youth-register-sr">Email Address</span><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M2 4h20v16H2zm0 2 10 8L22 6"/></svg><input type="email" autocomplete="email" placeholder="Email Address *" required></label>
                        <label class="youth-register-field"><span class="youth-register-sr">Your Age</span><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 5h18v16H3zM7 2v6m10-6v6M3 10h18m-14 4h2m3 0h2m3 0h1"/></svg><input type="number" min="1" max="120" placeholder="Your Age"></label>
                        <label class="youth-register-field"><span class="youth-register-sr">Your Area / District</span><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m2 9 10-5 10 5-10 5-10-5Zm4 2v6c3 3 9 3 12 0v-6m4-2v7"/></svg><select><option value="">Your Area / District</option><option>Bagalkot</option><option>Ballari</option><option>Belagavi</option><option>Bengaluru Rural</option><option>Bengaluru Urban</option><option>Bidar</option><option>Chamarajanagar</option><option>Chikkaballapur</option><option>Chikkamagaluru</option><option>Chitradurga</option><option>Dakshina Kannada</option><option>Davanagere</option><option>Dharwad</option><option>Gadag</option><option>Hassan</option><option>Haveri</option><option>Kalaburagi</option><option>Kodagu</option><option>Kolar</option><option>Koppal</option><option>Mandya</option><option>Mysuru</option><option>Raichur</option><option>Ramanagara</option><option>Shivamogga</option><option>Tumakuru</option><option>Udupi</option><option>Uttara Kannada</option><option>Vijayapura</option><option>Vijayanagara</option><option>Yadgir</option></select></label>
                        <label class="youth-register-field"><span class="youth-register-sr">Area of Interest</span><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 4h18v16H3zM4 17l6-6 3 3 7-7"/></svg><select><option value="">Area of Interest</option><option>Campus Chapters</option><option>Youth Contests</option><option>SATYA Fellowship</option><option>Ambassador Opportunities</option><option>Other</option></select></label>
                    </div>
                    <label class="youth-register-consent"><input type="checkbox" required><span>I agree to be contacted by PNP for youth programmes and related updates.</span></label>
                    <button type="submit" disabled>Submit Registration <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 12h17m-6-6 6 6-6 6"/></svg></button>
                    <p id="youth-register-status" role="status" tabindex="-1">Form preview. Online registration is currently unavailable.</p>
                </div>
            </form>
        </section>
    </main>
    <div data-site-footer></div>
</body>
</html>
