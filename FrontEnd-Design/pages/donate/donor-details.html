<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Donor Details | PNP</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="donor-details.css">
    <script src="../../shared-layout.js" defer></script>
    <script src="../../script.js" defer></script>
    <script src="campaigns.js" defer></script>
    <script src="donor-details.js" defer></script>
</head>
<body>
    <div data-site-header></div>
    <main id="main-content">
        <section class="donor-hero" aria-labelledby="donor-heading">
            <div class="donor-story">
                <header class="donor-intro">
                    <a class="donor-back" href="donate.html">Back to Donate</a>
                    <p class="donor-eyebrow">Support PNP</p>
                    <h1>People. Policy.<span>Progress.</span></h1>
                    <p>Your details are used to verify eligibility and prepare your donation receipt.</p>
                </header>
                <div class="donor-collage" aria-hidden="true">
                    <figure><img src="../../assets/hero/story-community.png" alt=""></figure>
                    <figure><img src="../../assets/hero/event-dialogue-preview.png" alt=""></figure>
                    <figure><img src="../../assets/hero/statistics-parliament.png" alt=""></figure>
                    <figure><img src="../../assets/hero/why-connected.png" alt=""></figure>
                </div>
            </div>
            <section class="donor-card" aria-labelledby="donor-heading">
                <header>
                    <h2 id="donor-heading"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7" r="4"/><path d="M3 23v-2a9 9 0 0 1 18 0v2"/></svg>Donor Details</h2>
                    <span class="donor-badge"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 4 6v5c0 6 4 9 8 11 4-2 8-5 8-11V6Z"/><path d="m8 12 3 3 5-6"/></svg> Local preview</span>
                </header>
                <p class="donor-summary" id="donor-summary" hidden></p>
                <p id="donor-campaign" class="donor-summary" hidden></p>
                <p id="donor-missing"><a href="donate.html">Choose a donation amount</a> to continue.</p>
                <form id="donor-form" aria-describedby="donor-privacy" autocomplete="off" hidden>
                    <div class="donor-fields">
                        <label class="donor-field"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7" r="4"/><path d="M3 22a9 9 0 0 1 18 0"/></svg><span class="donor-field-content"><span class="donor-field-label">Full Name <b aria-hidden="true">*</b></span><input type="text" id="donor-name" required></span></label>
                        <label class="donor-field"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h3l2 5-3 2a14 14 0 0 0 5 5l2-3 5 2v3a4 4 0 0 1-4 4C10 21 3 14 3 7a4 4 0 0 1 4-4Z"/></svg><span class="donor-field-content"><span class="donor-field-label">Mobile Number <b aria-hidden="true">*</b></span><input type="tel" inputmode="numeric" id="donor-mobile" pattern="[0-9]{10}" maxlength="10" title="Enter a 10-digit mobile number" required></span></label>
                        <label class="donor-field"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m3 6 9 7 9-7"/></svg><span class="donor-field-content"><span class="donor-field-label">Email Address <b aria-hidden="true">*</b></span><input type="email" id="donor-email" required></span></label>
                        <label class="donor-field"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><circle cx="8" cy="10" r="2"/><path d="M5 16h6m3-6h5m-5 4h5"/></svg><span class="donor-field-content"><span class="donor-field-label">PAN Number <b aria-hidden="true">*</b></span><input type="text" id="donor-pan" pattern="[A-Za-z]{5}[0-9]{4}[A-Za-z]" maxlength="10" autocapitalize="characters" spellcheck="false" title="Enter five letters, four digits, and one letter" required></span></label>
                    </div>
                    <label class="donor-declaration"><input type="checkbox" required><span>I am an Indian citizen and the amount being donated is from my own legitimate funds, in accordance with applicable laws. <b aria-hidden="true">*</b></span></label>
                    <p class="donor-privacy" id="donor-privacy">Use sample details in this preview. Entries are kept in the form only until submission.</p>
                    <button type="submit" disabled>Continue to Payment <span aria-hidden="true">&rarr;</span></button>
                </form>
            </section>
        </section>
    </main>
    <div data-site-footer></div>
</body>
</html>
