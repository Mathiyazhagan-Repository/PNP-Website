<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Data Deletion Request | PNP</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Manrope:wght@400;600;700;800&amp;display=swap">
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="dashboard.css">
  <link rel="stylesheet" href="profile.css">
  <link rel="stylesheet" href="settings.css">
  <link rel="stylesheet" href="delete-account.css">
  <script src="../../shared-layout.js" defer></script>
  <script src="../../script.js" defer></script>
  <script src="delete-account.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <div data-site-header></div>
  <svg class="as-defs" aria-hidden="true"><defs>
    <symbol id="ad-delete-icon" viewBox="0 0 24 24"><path d="M3 6h18M6 6l1 15h10l1-15M8 6V3h8v3m-6 4v7m4-7v7"/></symbol>
  </defs></svg>
  <main id="main-content">
    <section class="account-dashboard account-profile account-settings account-deletion" aria-labelledby="deletionTitle">
      <div class="dashboard-layout">
<nav class="dashboard-sidebar" aria-label="Account navigation">                    <a href="dashboard.html"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M2 11 12 3l10 8M5 10v11h5v-6h4v6h5V10"/></svg> Dashboard</a>
                    <a href="profile.html"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M16 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0ZM4 21v-2a8 8 0 0 1 16 0v2z"/></svg> <span>My Profile</span></a>
                    <a href="membership.html"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M2 5h20v14H2zM2 9h20M5 15h5"/></svg> <span>My Membership</span></a>
                    <a href="donations.html"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M2 13h5l4 2h5l4-4 2 2-6 6H8l-6-2m10-8-3-3a2 2 0 0 1 3-3 2 2 0 0 1 3 3z"/></svg> <span>My Donations</span></a>
                    <a href="settings.html"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M9 3h6l1 3 3 1 2 4-2 2v3l-3 3-3-1-2 3-4-1-1-3-3-1-1-4 3-2V7l3-1zM15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/></svg> <span>Account Settings</span></a>
                    <a href="delete-account.html" aria-current="page"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 6h18M6 6l1 15h10l1-15M8 6V3h8v3m-6 4v7m4-7v7"/></svg> Data Deletion Request</a>
                    <a href="../grievance/hotline.html"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0ZM9 8c1-3 7-3 7 1 0 2-4 2-4 5m0 3h.01"/></svg> Help &amp; Support</a>
                    <a class="dashboard-exit" href="login.html"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M10 3H3v18h7m5-5 5-4-5-4m-7 4h12"/></svg> Logout</a>
                </nav>
        <div class="as-main deletion-main">
          <header class="profile-heading as-heading">
            <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#ad-delete-icon"/></svg>
            <div><h1 id="deletionTitle">Data Deletion Request</h1><p>Request to permanently delete your personal information from the PNP platform.</p></div>
          </header>
          <div class="deletion-content">
            <div class="deletion-art" aria-hidden="true">
              <div class="deletion-sun"></div>
              <div class="deletion-machine"></div>
              <div class="deletion-paper"><span></span><i></i><i></i><i></i></div>
              <div class="deletion-slot"></div>
              <div class="deletion-strips"><i></i><i></i><i></i><i></i><i></i><i></i></div>
            </div>
            <form class="deletion-form" id="deletionForm">
              <h2>Tell Us Your Request</h2>
              <div class="deletion-fields">
                <label for="deletionReason">Reason for Deletion <span aria-hidden="true">*</span></label>
                <select id="deletionReason" name="reason" required>
                  <option value="">Select a reason</option>
                  <option value="privacy">Privacy concerns</option>
                  <option value="no_longer_needed">I no longer need my account</option>
                  <option value="duplicate">Duplicate account</option>
                  <option value="other">Other</option>
                </select>
                <label for="deletionDetails">Additional Details (Optional)</label>
                <textarea id="deletionDetails" name="details" rows="2" maxlength="300" placeholder="Share any additional information (if any)" aria-describedby="deletionCount"></textarea>
                <p class="deletion-count" id="deletionCount">0 / 300</p>
                <label class="deletion-confirm"><input id="deletionConfirm" type="checkbox" required><span>I understand that deleting my personal information is permanent and cannot be reversed.</span></label>
                <div class="as-actions">
                  <button class="as-save" type="submit" id="deletionSubmit"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#ad-delete-icon"/></svg> Submit Deletion Request</button>
                  <button class="as-secondary" type="button" id="deletionCancel">Cancel</button>
                </div>
                <p class="as-status" id="deletionStatus" role="status"></p>
                <a id="deletionLogin" href="login.html" hidden>Go to Login</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </section>
  </main>
  <div data-site-footer></div>
</body>
</html>
